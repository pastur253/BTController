plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.compose.compiler)
}

android {
    namespace 'com.bluetoothcontroller.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bluetoothcontroller.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            def props = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystorePropertiesFile.withInputStream { props.load(it) }
            }

            def ksFile = System.getenv("KEYSTORE_FILE") ?: props.getProperty("storeFile") ?: "release.jks"
            def ksPass = System.getenv("KEYSTORE_PASSWORD") ?: props.getProperty("storePassword")
            def kAlias = System.getenv("KEY_ALIAS") ?: props.getProperty("keyAlias")
            def kPass = System.getenv("KEY_PASSWORD") ?: props.getProperty("keyPassword")

            def resolvedFile = rootProject.file(ksFile)
            if (!resolvedFile.exists()) {
                resolvedFile = file(ksFile)
            }

            if (ksPass && kAlias && kPass && resolvedFile.exists()) {
                storeFile resolvedFile
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def releaseSigning = signingConfigs.getByName("release")
            if (releaseSigning.storeFile != null && releaseSigning.storeFile.exists()) {
                signingConfig releaseSigning
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.kotlinx.coroutines.android

    debugImplementation libs.androidx.compose.ui.tooling
}

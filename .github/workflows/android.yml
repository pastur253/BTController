name: Android CI / Release Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64
          b64 = os.environ.get('KEYSTORE_BASE64', '').strip()
          if b64:
              try:
                  with open('release.jks', 'wb') as f:
                      f.write(base64.b64decode(b64))
                  print('Keystore successfully decoded to release.jks')
              except Exception as e:
                  print(f'Error decoding keystore: {e}')
          else:
              print('KEYSTORE_BASE64 is empty or not set, fallback to debug')
          "

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log || {
            echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Clean up Keystore
        if: always()
        run: |
          rm -f release.jks

      - name: Prepare APK for release
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-apks/BTController-release.apk \;

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTController-release
          path: release-apks/BTController-release.apk

      - name: Publish GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/BTController-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

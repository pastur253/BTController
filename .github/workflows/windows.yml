name: Windows CI / Release Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows 11 MSIX
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: |
          dotnet restore windows/BTController.sln -p:Platform=x64

      - name: Decode PFX Signing Certificate (if configured)
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            $pfxPath = "$env:RUNNER_TEMP\signing.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
            if ([string]::IsNullOrEmpty($env:PFX_PASSWORD)) {
              $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Exportable
            } else {
              $securePass = ConvertTo-SecureString -String $env:PFX_PASSWORD -Force -AsPlainText
              $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePass -Exportable
            }
            "has_cert=true" >> $env:GITHUB_OUTPUT
            "pfx_path=$pfxPath" >> $env:GITHUB_OUTPUT
            "thumbprint=$($imported.Thumbprint)" >> $env:GITHUB_OUTPUT
          } else {
            "has_cert=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build WinUI 3 MSIX Package
        shell: pwsh
        run: |
          $msixOutDir = (Join-Path $pwd "windows\artifacts\msix") + "\"
          $msbuildArgs = @(
            "windows/BTController.App/BTController.App.csproj",
            "-t:Restore,Build",
            "-p:Configuration=Release",
            "-p:Platform=x64",
            "-p:GenerateAppxPackageOnBuild=true",
            "-p:UapAppxPackageBuildMode=SideloadOnly",
            "-p:AppxPackageDir=$msixOutDir"
          )

          if ("${{ steps.cert.outputs.has_cert }}" -eq "true") {
            $msbuildArgs += "-p:AppxPackageSigningEnabled=true"
            $msbuildArgs += "-p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}"
          } else {
            $msbuildArgs += "-p:AppxPackageSigningEnabled=false"
          }

          msbuild @msbuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseDir = Join-Path $pwd "windows\artifacts\release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $msixFile = Get-ChildItem -Path $msixOutDir -Recurse -Filter "BTController.App*.msix" | Select-Object -First 1
          if (-not $msixFile) {
            $msixFile = Get-ChildItem -Path $msixOutDir -Recurse -Filter "*.msix" | Where-Object { $_.FullName -notmatch '\\Dependencies\\' } | Select-Object -First 1
          }
          if (-not $msixFile) {
            Write-Error "No .msix package found in $msixOutDir"
            exit 1
          }
          Copy-Item -Path $msixFile.FullName -Destination (Join-Path $releaseDir "BTController-Windows-x64.msix") -Force

          $cerFile = Get-ChildItem -Path $msixOutDir -Recurse -Filter "BTController.App*.cer" | Select-Object -First 1
          if (-not $cerFile) {
            $cerFile = Get-ChildItem -Path $msixOutDir -Recurse -Filter "*.cer" | Select-Object -First 1
          }
          if ($cerFile) {
            Copy-Item -Path $cerFile.FullName -Destination (Join-Path $releaseDir "BTController-Windows-x64.cer") -Force
          }

      - name: Cleanup PFX Certificate
        if: always() && steps.cert.outputs.has_cert == 'true'
        shell: pwsh
        run: |
          if (Test-Path "${{ steps.cert.outputs.pfx_path }}") {
            Remove-Item "${{ steps.cert.outputs.pfx_path }}" -Force
          }
          $thumb = "${{ steps.cert.outputs.thumbprint }}"
          if (-not [string]::IsNullOrWhiteSpace($thumb) -and (Test-Path "Cert:\CurrentUser\My\$thumb")) {
            Remove-Item "Cert:\CurrentUser\My\$thumb" -Force
          }

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTController-MSIX
          path: windows/artifacts/release/BTController-Windows-x64.*
          if-no-files-found: error

      - name: Attach MSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/artifacts/release/BTController-Windows-x64.*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
